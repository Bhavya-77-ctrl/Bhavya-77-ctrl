<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-label="Research Matrix: AI, Quantum Computing, Computational Biology &amp; Autonomous Systems">
<defs>
  <linearGradient id="bgML" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="50%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#ffffff"/>
  </linearGradient>
  <linearGradient id="accentHML" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#059669" stop-opacity="0"/>
    <stop offset="30%" stop-color="#059669"/>
    <stop offset="70%" stop-color="#7c3aed"/>
    <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="barGL" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#059669"/>
    <stop offset="100%" stop-color="#059669" stop-opacity="0.15"/>
  </linearGradient>
  <linearGradient id="barVL" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#7c3aed"/>
    <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.15"/>
  </linearGradient>
  <linearGradient id="barBL" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0284c7"/>
    <stop offset="100%" stop-color="#0284c7" stop-opacity="0.15"/>
  </linearGradient>
  <linearGradient id="barAL" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#d97706"/>
    <stop offset="100%" stop-color="#d97706" stop-opacity="0.15"/>
  </linearGradient>
  <linearGradient id="radarFillL" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#059669" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.12"/>
  </linearGradient>
  <filter id="glowML">
    <feGaussianBlur stdDeviation="2" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="bgBlurML"><feGaussianBlur stdDeviation="40"/></filter>
  <clipPath id="clipML"><rect width="1280" height="280" rx="18"/></clipPath>
</defs>

<g clip-path="url(#clipML)">
<!-- Background -->
<rect width="1280" height="280" fill="url(#bgML)"/>
<g opacity="0.04" stroke="#059669" stroke-width="0.5">
  <line x1="0" y1="70" x2="1280" y2="70"/>
  <line x1="0" y1="140" x2="1280" y2="140"/>
  <line x1="0" y1="210" x2="1280" y2="210"/>
  <line x1="426" y1="0" x2="426" y2="280"/>
  <line x1="853" y1="0" x2="853" y2="280"/>
</g>
<circle cx="213" cy="140" r="160" fill="#059669" opacity="0.04" filter="url(#bgBlurML)"/>
<circle cx="640" cy="140" r="160" fill="#7c3aed" opacity="0.03" filter="url(#bgBlurML)"/>
<circle cx="1067" cy="140" r="160" fill="#0284c7" opacity="0.04" filter="url(#bgBlurML)"/>

<!-- Top / Bottom accent lines -->
<rect x="0" y="0" width="1280" height="2" fill="url(#accentHML)" opacity="0.5"/>
<rect x="0" y="278" width="1280" height="2" fill="url(#accentHML)" opacity="0.5"/>

<!-- Outer border -->
<rect x="0.5" y="0.5" width="1279" height="279" rx="18" fill="none" stroke="#e2e8f0"/>

<!-- ═══════════════════════════════
     PANEL 1 — Research Model Accuracy & Impact
════════════════════════════════ -->
<g transform="translate(36, 0)">
