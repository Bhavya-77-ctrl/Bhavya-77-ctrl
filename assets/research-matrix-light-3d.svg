  <text x="12" y="228" text-anchor="end" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8">0%</text>
  <text x="12" y="160" text-anchor="end" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8">50%</text>
  <text x="12" y="92" text-anchor="end" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8">99%</text>
  <line x1="16" y1="157" x2="380" y2="157" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="16" y1="89" x2="380" y2="89" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="3 3"/>

  <!-- Bar 1: HRI Gesture/Voice — 98.4% -->
  <rect x="24" y="73" width="44" height="152" rx="4" fill="url(#barGL)" opacity="0.9"/>
  <rect x="24" y="73" width="44" height="3" rx="2" fill="#059669" filter="url(#glowML)"/>
  <text x="46" y="67" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#059669">98.4%</text>

  <!-- Bar 2: Q-Net Routing — 96.1% -->
  <rect x="84" y="85" width="44" height="140" rx="4" fill="url(#barVL)" opacity="0.85"/>
  <rect x="84" y="85" width="44" height="3" rx="2" fill="#7c3aed" filter="url(#glowML)"/>
  <text x="106" y="79" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#7c3aed">96.1%</text>

