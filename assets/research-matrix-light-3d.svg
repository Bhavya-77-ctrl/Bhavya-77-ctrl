    <text x="38" y="38" font-family="ui-monospace, monospace" font-size="10" fill="#059669">AI Social Intelligence &amp; Anomaly Detection</text>
  </g>

  <!-- Card 3: Drone UAV Technology -->
  <g transform="translate(14, 184)">
    <rect x="0" y="0" width="350" height="48" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="20" cy="24" r="8" fill="#e0f2fe" opacity="0.8"/>
    <text x="20" y="28" text-anchor="middle" font-size="11">🚁</text>
    <text x="38" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Drone Technology &amp; Flight Operations</text>
    <text x="38" y="38" font-family="ui-monospace, monospace" font-size="10" fill="#0284c7">Aerial Systems Bootcamp · IIITDM Kurnool</text>
