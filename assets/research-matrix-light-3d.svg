  <line x1="200" y1="160" x2="271" y2="137" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="200" y1="160" x2="244" y2="220" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="200" y1="160" x2="156" y2="220" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="200" y1="160" x2="129" y2="137" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Data Radar Polygon -->
  <polygon points="200,88 265,140 239,214 163,211 134,139" fill="url(#radarFillL)" stroke="#059669" stroke-width="1.8" filter="url(#glowML)"/>
  <circle cx="200" cy="88" r="3.5" fill="#059669"/>
  <circle cx="265" cy="140" r="3.5" fill="#0284c7"/>
  <circle cx="239" cy="214" r="3.5" fill="#7c3aed"/>
  <circle cx="163" cy="211" r="3.5" fill="#d97706"/>
  <circle cx="134" cy="139" r="3.5" fill="#059669"/>

  <!-- Axis Text Labels -->
  <text x="200" y="76" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#059669">Accuracy (98.4%)</text>
  <text x="282" y="140" font-family="ui-monospace, monospace" font-size="8.5" fill="#0284c7">Multimodal</text>
  <text x="254" y="235" font-family="ui-monospace, monospace" font-size="8.5" fill="#7c3aed">&lt;14ms Latency</text>
  <text x="146" y="235" text-anchor="end" font-family="ui-monospace, monospace" font-size="8.5" fill="#d97706">Q-Adaptation</text>
  <text x="118" y="140" text-anchor="end" font-family="ui-monospace, monospace" font-size="8.5" fill="#059669">Robustness</text>
