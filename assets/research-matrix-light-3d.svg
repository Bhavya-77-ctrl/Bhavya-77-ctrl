  <rect x="144" y="77" width="44" height="148" rx="4" fill="url(#barBL)" opacity="0.85"/>
  <rect x="144" y="77" width="44" height="3" rx="2" fill="#0284c7" filter="url(#glowML)"/>
  <text x="166" y="71" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#0284c7">97.8%</text>

  <!-- Bar 4: Smart Energy Prediction — 94.5% -->
  <rect x="204" y="93" width="44" height="132" rx="4" fill="url(#barGL)" opacity="0.75"/>
  <rect x="204" y="93" width="44" height="3" rx="2" fill="#059669" filter="url(#glowML)"/>
  <text x="226" y="87" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#059669">94.5%</text>

  <!-- Bar 5: Diabetes Clinical Eval — 95.8% -->
  <rect x="264" y="87" width="44" height="138" rx="4" fill="url(#barAL)" opacity="0.85"/>
  <rect x="264" y="87" width="44" height="3" rx="2" fill="#d97706" filter="url(#glowML)"/>
  <text x="286" y="81" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#d97706">95.8%</text>

  <!-- Bar 6: Quantum Metaheuristics — Survey -->
  <rect x="324" y="80" width="44" height="145" rx="4" fill="url(#barVL)" opacity="0.8"/>
  <rect x="324" y="80" width="44" height="3" rx="2" fill="#7c3aed" filter="url(#glowML)"/>
  <text x="346" y="74" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#7c3aed">Survey</text>
</g>

<!-- Divider 1 -->
<line x1="436" y1="20" x2="436" y2="260" stroke="#e2e8f0" stroke-width="1"/>

<!-- ═══════════════════════════════
     PANEL 2 — Multimodal AI Radar
════════════════════════════════ -->
<g transform="translate(450, 0)">
  <rect x="0" y="18" width="3" height="36" fill="#7c3aed" rx="2"/>
  <text x="14" y="35" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Architecture Radar</text>
  <text x="14" y="52" font-family="ui-monospace, monospace" font-size="10" fill="#64748b" letter-spacing="1.5">HYBRID AI &amp; ROBUSTNESS</text>

  <!-- Radar Chart Center at (200, 160), radius 75 -->
  <polygon points="200,85 271,137 244,220 156,220 129,137" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <polygon points="200,115 243,146 226,196 174,196 157,146" fill="none" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2 2"/>
  <polygon points="200,137 222,153 213,178 187,178 178,153" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>

  <!-- Axis Lines -->
