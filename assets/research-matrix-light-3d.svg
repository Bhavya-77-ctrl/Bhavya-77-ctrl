  <text x="14" y="52" font-family="ui-monospace, monospace" font-size="10" fill="#64748b" letter-spacing="1.5">6x VERIFIED IEEE &amp; JOURNAL PUBS</text>

  <!-- Labels -->
  <text x="46" y="240" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#475569">HRI</text>
  <text x="106" y="240" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#475569">Q-Net</text>
  <text x="166" y="240" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#475569">Cancer</text>
  <text x="226" y="240" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#475569">Energy</text>
  <text x="286" y="240" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#475569">Diabetes</text>
  <text x="346" y="240" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#475569">Q-Search</text>

  <!-- Base line -->
