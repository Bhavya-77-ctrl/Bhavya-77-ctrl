  <text x="14" y="35" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Honors &amp; Deployment</text>
  <text x="14" y="52" font-family="ui-monospace, monospace" font-size="10" fill="#64748b" letter-spacing="1.5">NATIONAL HACKATHONS &amp; TECH</text>

  <!-- Card 1: WebJam Champion -->
  <g transform="translate(14, 72)">
    <rect x="0" y="0" width="350" height="48" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="20" cy="24" r="8" fill="#fef3c7" opacity="0.8"/>
    <text x="20" y="28" text-anchor="middle" font-size="11">🏆</text>
    <text x="38" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#0f172a">WebJam 2026 Winner · IEEE RECW</text>
