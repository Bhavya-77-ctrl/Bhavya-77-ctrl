<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-label="Research Matrix: AI, Quantum Computing, Computational Biology &amp; Autonomous Systems">
<defs>
  <linearGradient id="bgM" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#070c14"/>
    <stop offset="50%" stop-color="#0c1422"/>
    <stop offset="100%" stop-color="#070c14"/>
  </linearGradient>
  <linearGradient id="accentHM" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
    <stop offset="30%" stop-color="#10b981"/>
    <stop offset="70%" stop-color="#8b5cf6"/>
    <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="barG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#10b981"/>
    <stop offset="100%" stop-color="#10b981" stop-opacity="0.2"/>
  </linearGradient>
  <linearGradient id="barV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#8b5cf6"/>
    <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2"/>
  </linearGradient>
  <linearGradient id="barB" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#38bdf8"/>
    <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
  </linearGradient>
  <linearGradient id="barA" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#fbbf24"/>
    <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.2"/>
  </linearGradient>
  <linearGradient id="radarFill" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.15"/>
  </linearGradient>
  <filter id="glowM">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="bgBlurM"><feGaussianBlur stdDeviation="40"/></filter>
  <clipPath id="clipM"><rect width="1280" height="280" rx="18"/></clipPath>
</defs>

<g clip-path="url(#clipM)">
<!-- Background -->
<rect width="1280" height="280" fill="url(#bgM)"/>
<g opacity="0.04" stroke="#10b981" stroke-width="0.5">
  <line x1="0" y1="70" x2="1280" y2="70"/>
  <line x1="0" y1="140" x2="1280" y2="140"/>
  <line x1="0" y1="210" x2="1280" y2="210"/>
  <line x1="426" y1="0" x2="426" y2="280"/>
  <line x1="853" y1="0" x2="853" y2="280"/>
</g>
<circle cx="213" cy="140" r="160" fill="#10b981" opacity="0.05" filter="url(#bgBlurM)"/>
<circle cx="640" cy="140" r="160" fill="#8b5cf6" opacity="0.04" filter="url(#bgBlurM)"/>
<circle cx="1067" cy="140" r="160" fill="#38bdf8" opacity="0.05" filter="url(#bgBlurM)"/>

<!-- Top / Bottom accent lines -->
<rect x="0" y="0" width="1280" height="2" fill="url(#accentHM)" opacity="0.7"/>
<rect x="0" y="278" width="1280" height="2" fill="url(#accentHM)" opacity="0.7"/>

<!-- Outer border -->
<rect x="0.5" y="0.5" width="1279" height="279" rx="18" fill="none" stroke="#1c2d42"/>

<!-- ═══════════════════════════════
     PANEL 1 — Research Model Accuracy & Impact
════════════════════════════════ -->
<g transform="translate(36, 0)">
  <rect x="0" y="18" width="3" height="36" fill="#10b981" rx="2"/>
  <text x="14" y="35" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Peer-Reviewed Papers</text>
  <text x="14" y="52" font-family="ui-monospace, monospace" font-size="10" fill="#64748b" letter-spacing="1.5">6x VERIFIED IEEE &amp; JOURNAL PUBS</text>

  <!-- Labels -->
  <text x="46" y="240" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8">HRI</text>
  <text x="106" y="240" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8">Q-Net</text>
  <text x="166" y="240" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8">Cancer</text>
  <text x="226" y="240" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8">Energy</text>
  <text x="286" y="240" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8">Diabetes</text>
  <text x="346" y="240" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8">Q-Search</text>

  <!-- Base line -->
  <line x1="16" y1="225" x2="380" y2="225" stroke="#1e2d42" stroke-width="1.5"/>
  <text x="12" y="228" text-anchor="end" font-family="ui-monospace, monospace" font-size="9" fill="#475569">0%</text>
  <text x="12" y="160" text-anchor="end" font-family="ui-monospace, monospace" font-size="9" fill="#475569">50%</text>
  <text x="12" y="92" text-anchor="end" font-family="ui-monospace, monospace" font-size="9" fill="#475569">99%</text>
  <line x1="16" y1="157" x2="380" y2="157" stroke="#1e2d42" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="16" y1="89" x2="380" y2="89" stroke="#1e2d42" stroke-width="0.5" stroke-dasharray="3 3"/>

  <!-- Bar 1: HRI Gesture/Voice — 98.4% -->
  <rect x="24" y="73" width="44" height="152" rx="4" fill="url(#barG)" opacity="0.9"/>
  <rect x="24" y="73" width="44" height="3" rx="2" fill="#10b981" filter="url(#glowM)"/>
  <text x="46" y="67" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#10b981">98.4%</text>

  <!-- Bar 2: Q-Net Routing — 96.1% -->
  <rect x="84" y="85" width="44" height="140" rx="4" fill="url(#barV)" opacity="0.85"/>
  <rect x="84" y="85" width="44" height="3" rx="2" fill="#8b5cf6" filter="url(#glowM)"/>
  <text x="106" y="79" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#c084fc">96.1%</text>

  <!-- Bar 3: Cancer Gene Detection — 97.8% -->
  <rect x="144" y="77" width="44" height="148" rx="4" fill="url(#barB)" opacity="0.85"/>
  <rect x="144" y="77" width="44" height="3" rx="2" fill="#38bdf8" filter="url(#glowM)"/>
  <text x="166" y="71" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#38bdf8">97.8%</text>

  <!-- Bar 4: Smart Energy Prediction — 94.5% -->
  <rect x="204" y="93" width="44" height="132" rx="4" fill="url(#barG)" opacity="0.75"/>
  <rect x="204" y="93" width="44" height="3" rx="2" fill="#10b981" filter="url(#glowM)"/>
  <text x="226" y="87" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#10b981">94.5%</text>

  <!-- Bar 5: Diabetes Clinical Eval — 95.8% -->
  <rect x="264" y="87" width="44" height="138" rx="4" fill="url(#barA)" opacity="0.85"/>
  <rect x="264" y="87" width="44" height="3" rx="2" fill="#fbbf24" filter="url(#glowM)"/>
  <text x="286" y="81" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#fbbf24">95.8%</text>

  <!-- Bar 6: Quantum Metaheuristics — Top Tier -->
  <rect x="324" y="80" width="44" height="145" rx="4" fill="url(#barV)" opacity="0.8"/>
  <rect x="324" y="80" width="44" height="3" rx="2" fill="#8b5cf6" filter="url(#glowM)"/>
  <text x="346" y="74" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#c084fc">Survey</text>
</g>

<!-- Divider 1 -->
<line x1="436" y1="20" x2="436" y2="260" stroke="#1c2d42" stroke-width="1"/>

<!-- ═══════════════════════════════
     PANEL 2 — Multimodal AI Radar
════════════════════════════════ -->
<g transform="translate(450, 0)">
  <rect x="0" y="18" width="3" height="36" fill="#8b5cf6" rx="2"/>
  <text x="14" y="35" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Architecture Radar</text>
  <text x="14" y="52" font-family="ui-monospace, monospace" font-size="10" fill="#64748b" letter-spacing="1.5">HYBRID AI &amp; ROBUSTNESS</text>

  <!-- Radar Chart Center at (200, 160), radius 75 -->
  <!-- Outer Pentagon (100%) -->
  <polygon points="200,85 271,137 244,220 156,220 129,137" fill="none" stroke="#1c2d42" stroke-width="1"/>
  <!-- Middle Pentagon (60%) -->
  <polygon points="200,115 243,146 226,196 174,196 157,146" fill="none" stroke="#1c2d42" stroke-width="0.8" stroke-dasharray="2 2"/>
  <!-- Inner Pentagon (30%) -->
  <polygon points="200,137 222,153 213,178 187,178 178,153" fill="none" stroke="#1c2d42" stroke-width="0.5"/>

  <!-- Axis Lines -->
  <line x1="200" y1="160" x2="200" y2="85" stroke="#1c2d42" stroke-width="1"/>
  <line x1="200" y1="160" x2="271" y2="137" stroke="#1c2d42" stroke-width="1"/>
  <line x1="200" y1="160" x2="244" y2="220" stroke="#1c2d42" stroke-width="1"/>
  <line x1="200" y1="160" x2="156" y2="220" stroke="#1c2d42" stroke-width="1"/>
  <line x1="200" y1="160" x2="129" y2="137" stroke="#1c2d42" stroke-width="1"/>

  <!-- Data Radar Polygon (Model Evaluation) -->
  <!-- Accuracy: 95% (200, 88), Multimodal: 92% (265, 140), Low Latency: 90% (239, 214), Quantum: 85% (163, 211), Generalization: 93% (134, 139) -->
  <polygon points="200,88 265,140 239,214 163,211 134,139" fill="url(#radarFill)" stroke="#10b981" stroke-width="1.8" filter="url(#glowM)"/>
  <circle cx="200" cy="88" r="3.5" fill="#10b981"/>
  <circle cx="265" cy="140" r="3.5" fill="#38bdf8"/>
  <circle cx="239" cy="214" r="3.5" fill="#8b5cf6"/>
  <circle cx="163" cy="211" r="3.5" fill="#fbbf24"/>
  <circle cx="134" cy="139" r="3.5" fill="#10b981"/>

  <!-- Axis Text Labels -->
  <text x="200" y="76" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#10b981">Accuracy (98.4%)</text>
  <text x="282" y="140" font-family="ui-monospace, monospace" font-size="8.5" fill="#38bdf8">Multimodal</text>
  <text x="254" y="235" font-family="ui-monospace, monospace" font-size="8.5" fill="#8b5cf6">&lt;14ms Latency</text>
  <text x="146" y="235" text-anchor="end" font-family="ui-monospace, monospace" font-size="8.5" fill="#fbbf24">Q-Adaptation</text>
  <text x="118" y="140" text-anchor="end" font-family="ui-monospace, monospace" font-size="8.5" fill="#10b981">Robustness</text>
</g>

<!-- Divider 2 -->
<line x1="860" y1="20" x2="860" y2="260" stroke="#1c2d42" stroke-width="1"/>

<!-- ═══════════════════════════════
     PANEL 3 — Hackathon & Systems Telemetry
════════════════════════════════ -->
<g transform="translate(876, 0)">
  <rect x="0" y="18" width="3" height="36" fill="#38bdf8" rx="2"/>
  <text x="14" y="35" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Honors &amp; Deployment</text>
  <text x="14" y="52" font-family="ui-monospace, monospace" font-size="10" fill="#64748b" letter-spacing="1.5">NATIONAL HACKATHONS &amp; TECH</text>

  <!-- Card 1: WebJam Champion -->
  <g transform="translate(14, 72)">
    <rect x="0" y="0" width="350" height="48" rx="8" fill="#101524" stroke="#2a2347"/>
    <circle cx="20" cy="24" r="8" fill="#fbbf24" opacity="0.2"/>
    <text x="20" y="28" text-anchor="middle" font-size="11">🏆</text>
    <text x="38" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#ffffff">WebJam 2026 Winner · IEEE RECW</text>
    <text x="38" y="38" font-family="ui-monospace, monospace" font-size="10" fill="#fbbf24">1st Place — Technical &amp; Creative Web Dev</text>
  </g>

  <!-- Card 2: SIH 2026 Social IQ -->
  <g transform="translate(14, 128)">
    <rect x="0" y="0" width="350" height="48" rx="8" fill="#0d1c1a" stroke="#16382f"/>
    <circle cx="20" cy="24" r="8" fill="#10b981" opacity="0.2"/>
    <text x="20" y="28" text-anchor="middle" font-size="11">💡</text>
    <text x="38" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Smart India Hackathon 2026 · Social IQ</text>
    <text x="38" y="38" font-family="ui-monospace, monospace" font-size="10" fill="#34d399">AI Social Intelligence &amp; Anomaly Detection</text>
  </g>

  <!-- Card 3: Drone UAV Technology -->
  <g transform="translate(14, 184)">
    <rect x="0" y="0" width="350" height="48" rx="8" fill="#0c1726" stroke="#1a2f47"/>
    <circle cx="20" cy="24" r="8" fill="#38bdf8" opacity="0.2"/>
    <text x="20" y="28" text-anchor="middle" font-size="11">🚁</text>
    <text x="38" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Drone Technology &amp; Flight Operations</text>
    <text x="38" y="38" font-family="ui-monospace, monospace" font-size="10" fill="#38bdf8">Aerial Systems Bootcamp · IIITDM Kurnool</text>
  </g>
</g>
</g>
</svg>
