<svg xmlns="http://www.w3.org/2000/svg" width="600" height="210" viewBox="0 0 600 210" role="img" aria-label="Social IQ — AI Social Media Intelligence Platform">
<style>
@keyframes sweep{0%{transform:translateX(-120px)}60%,100%{transform:translateX(720px)}}
@keyframes live{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes bar1{0%,100%{height:6px;y:18px}50%{height:22px;y:2px}}
@keyframes bar2{0%,100%{height:20px;y:4px}50%{height:8px;y:16px}}
@keyframes bar3{0%,100%{height:12px;y:12px}50%{height:24px;y:0px}}
@keyframes bar4{0%,100%{height:22px;y:2px}50%{height:10px;y:14px}}
@keyframes bar5{0%,100%{height:14px;y:10px}50%{height:20px;y:4px}}
.sweep{animation:sweep 6s ease-in-out infinite}
.live{animation:live 1.6s ease-in-out infinite}
.b1{animation:bar1 .9s ease-in-out infinite}
.b2{animation:bar2 1.1s ease-in-out infinite}
.b3{animation:bar3 .8s ease-in-out infinite}
.b4{animation:bar4 1.2s ease-in-out infinite}
.b5{animation:bar5 1.0s ease-in-out infinite}
.card{transition:all .3s ease;cursor:pointer}
.card:hover{stroke:#10b981;filter:drop-shadow(0 0 12px rgba(16,185,129,0.3))}
</style>
<defs>
<linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#10b981" stop-opacity="0"/><stop offset=".5" stop-color="#10b981" stop-opacity=".08"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect x="1" y="1" width="598" height="208" rx="18"/></clipPath>
</defs>
<g clip-path="url(#c)">
  <rect width="600" height="210" fill="#0b1219"/>
  <rect class="sweep" x="0" y="0" width="120" height="210" fill="url(#shine)"/>
  <rect x="28" y="0" width="80" height="2" fill="#10b981"/>
</g>
<rect class="card" x="0.5" y="0.5" width="599" height="209" rx="18" fill="none" stroke="#1c2c3e"/>

<!-- Title -->
<text x="28" y="50" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, serif" font-size="26" font-weight="400" letter-spacing="-0.3" fill="#f1f5f9">Social IQ</text>

<!-- Live Pulse Bar -->
<g transform="translate(340, 32)">
  <rect class="b1" x="0" y="18" width="3.5" height="6" rx="1.75" fill="#10b981"/>
  <rect class="b2" x="7" y="4" width="3.5" height="20" rx="1.75" fill="#34d399"/>
  <rect class="b3" x="14" y="12" width="3.5" height="12" rx="1.75" fill="#38bdf8"/>
  <rect class="b4" x="21" y="2" width="3.5" height="22" rx="1.75" fill="#10b981"/>
  <rect class="b5" x="28" y="10" width="3.5" height="14" rx="1.75" fill="#34d399"/>
  <text x="40" y="18" font-family="ui-monospace, monospace" font-size="10.5" fill="#64748b">SENTIMENT AI</text>
</g>

<!-- Status Pill -->
<rect x="472" y="30" width="102" height="26" rx="13" fill="#092019" stroke="#10b981" stroke-opacity="0.5"/>
<circle class="live" cx="486" cy="43" r="3" fill="#10b981"/>
<text x="496" y="47.5" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#34d399">SIH '26 Nat'l</text>

<!-- Description -->
<text y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#94a3b8">
<tspan x="28" dy="0">AI-powered social media intelligence platform analyzing real-time</tspan>
<tspan x="28" dy="22">sentiment vectors, viral trend momentum, and anomalous engagements.</tspan>
</text>

<!-- Tech Badges -->
<rect x="28" y="142" width="68" height="26" rx="13" fill="#0f1925" stroke="#1d2e42"/><text x="62" y="159" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="#94a3b8">Python</text>
<rect x="104" y="142" width="76" height="26" rx="13" fill="#0f1925" stroke="#1d2e42"/><text x="142" y="159" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="#94a3b8">NLP &amp; ML</text>
<rect x="188" y="142" width="138" height="26" rx="13" fill="#0f1925" stroke="#1d2e42"/><text x="257" y="159" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="#94a3b8">Anomaly Detection</text>
<rect x="334" y="142" width="84" height="26" rx="13" fill="#0f1925" stroke="#1d2e42"/><text x="376" y="159" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="#94a3b8">React.js</text>
<rect x="426" y="142" width="76" height="26" rx="13" fill="#0f1925" stroke="#1d2e42"/><text x="464" y="159" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="#94a3b8">Node.js</text>
</svg>
